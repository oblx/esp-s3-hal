# tag-triggered ship: validate → (optional heavy) → kiosk poke
# tag: ship/esp-s3-hal-*
# kiosk: https://git.iot/Infra/Docs/raw/branch/main/01-network/ci-cd/kiosk-api-guide.md
name: ship
on:
  push:
    tags:
      - 'ship/esp-s3-hal-*'
  workflow_dispatch:
concurrency:
  group: ${{ gitea.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ vars.RUNNER_T1 }}
    timeout-minutes: 15
    steps:
      - name: checkout
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          GITEA_REPO: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          : "${GITEA_TOKEN:?}" "${GITEA_REPO:?}" "${GITEA_SHA:?}"
          git init
          git remote add origin "https://git.iot/${GITEA_REPO}.git"
          git -c http.extraHeader="AUTHORIZATION: token ${GITEA_TOKEN}" fetch --depth 1 origin "${GITEA_SHA}"
          git checkout --force FETCH_HEAD
      - name: gate
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -d src/hal
          test -d examples
  kiosk-health:
    needs: [validate]
    runs-on: ${{ vars.RUNNER_T1 }}
    timeout-minutes: 5
    steps:
      - name: remote-kiosk
        env:
          KIOSK_FQDN: ${{ vars.KIOSK_FQDN }}
        run: |
          set -euo pipefail
          : "${KIOSK_FQDN:?}"
          BASE="https://${KIOSK_FQDN}"
          curl -sf --max-time 10 "$BASE/health" | grep -q '"ok"'
          curl -sf --max-time 10 -X POST "$BASE/screen/poke" >/dev/null || true
          echo "kiosk-health-remote ok"
  kiosk-e2e:
    needs: [validate]
    runs-on: ${{ vars.RUNNER_T4 }}
    timeout-minutes: 5
    steps:
      - name: local-kiosk
        env:
          KIOSK_API_PORT: ${{ vars.KIOSK_API_PORT }}
        run: |
          set -euo pipefail
          : "${KIOSK_API_PORT:?}"
          BASE="http://127.0.0.1:${KIOSK_API_PORT}"
          curl -sf --max-time 10 "$BASE/health" | grep -q '"ok"'
          curl -sf --max-time 10 "$BASE/status" | grep -q '"api"'
          curl -sf --max-time 10 -X POST "$BASE/screen/poke" >/dev/null || true
          echo "kiosk-e2e-local ok"
