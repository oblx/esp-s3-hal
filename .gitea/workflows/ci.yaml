# validate on main · zero hardcode · fail-closed
# standards: https://git.iot/Infra/Docs/raw/branch/main/01-network/ci-cd/standards.md
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ vars.RUNNER_T1 }}
    timeout-minutes: 15
    steps:
      - name: checkout
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          GITEA_REPO: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          : "${GITEA_TOKEN:?}" "${GITEA_REPO:?}" "${GITEA_SHA:?}"
          git init
          git remote add origin "https://git.iot/${GITEA_REPO}.git"
          git -c http.extraHeader="AUTHORIZATION: token ${GITEA_TOKEN}" fetch --depth 1 origin "${GITEA_SHA}"
          git checkout --force FETCH_HEAD
      - name: tree-gate
        run: |
          set -euo pipefail
          test -f README.md
          test -d docs
          test -d src/hal
          test -d src/boot
          test -f docs/architecture.md
          test -f docs/hal.md
          test -f docs/net.md
          test -f docs/http.md
          test -f docs/boot.md
          test -f docs/flash.md
          test -f docs/examples.md
          test -f docs/ci.md
      - name: hardcode-gate
        run: |
          set -euo pipefail
          fail=0
          for n in github.com gaston sleipnir pochtl mjolnir quetzal 192.168. 10.; do
            if grep -RnF --exclude='ci.yaml' -- "$n" .gitea/workflows >/dev/null 2>&1; then
              echo "hardcode '$n' in .gitea/workflows"
              fail=1
            fi
          done
          exit "$fail"
      - name: docs-gate
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            n=$(wc -l <"$f")
            test "$n" -le 100 || { echo "too long: $f ($n)"; exit 1; }
          done < <(find docs -name '*.md' -print; printf '%s\n' README.md AGENTS.md)
