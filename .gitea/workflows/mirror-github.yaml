# mirror main → public GitHub via deploy key · .gitea stripped (not synced)
# secrets: ESP_S3_HAL_GH_DEPLOY_KEY (base64 ed25519 private) · vars: ESP_S3_HAL_GH_* · GH_SSH_HOST
name: mirror-github
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mirror-github-${{ gitea.ref }}
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ${{ vars.RUNNER_T1 }}
    timeout-minutes: 10
    steps:
      - name: checkout
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          GITEA_REPO: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          : "${GITEA_TOKEN:?}" "${GITEA_REPO:?}" "${GITEA_SHA:?}"
          git init
          git remote add origin "https://git.iot/${GITEA_REPO}.git"
          git -c http.extraHeader="AUTHORIZATION: token ${GITEA_TOKEN}" fetch origin "${GITEA_SHA}"
          git checkout --force FETCH_HEAD
      - name: push-github
        env:
          GH_SSH_HOST: ${{ vars.GH_SSH_HOST }}
          GH_REPO: ${{ vars.ESP_S3_HAL_GH_REPO }}
          GH_BRANCH: ${{ vars.ESP_S3_HAL_GH_BRANCH }}
          GH_KEY_B64: ${{ secrets.ESP_S3_HAL_GH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          : "${GH_SSH_HOST:?}" "${GH_REPO:?}" "${GH_BRANCH:?}" "${GH_KEY_B64:?}"
          umask 077
          KEY="./.gh_key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$GH_KEY_B64" | base64 -d >"$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i ${KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git rm -rf --cached .gitea >/dev/null
          git -c user.email=ci@local -c user.name=ci commit -m "drop .gitea for github mirror" >/dev/null
          git remote add github "git@${GH_SSH_HOST}:${GH_REPO}.git"
          git push --force github "HEAD:refs/heads/${GH_BRANCH}"
